name: CI
on:
  push:
    branches:
      - 'master'
  pull_request:
    types:
      - 'opened'
      - 'synchronize'
      - 'reopened'

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - name: Install Packages
        run: npm install
      - name: Lint
        run: npm run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Install Packages
        run: npm install

      - name: Build
        run: npm run build

      - name: Type check
        run: npm run tsc

      - name: Cache dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 3
          name: dist
          path: dist

  test:
    name: Test
    strategy:
      matrix:
        node: [20, 22, 24, 'lts/*']
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node.js v${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install Packages
        run: npm install --legacy-peer-deps
      - name: Restore dist cache
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist
      - name: Test
        run: npm test

  test-with-eslint-v8:
    name: Test with ESLint v8
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node.js v18
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 18
      - name: Install Packages
        run: npm install --legacy-peer-deps
      - name: Install ESLint v8
        run: npm install --save-dev eslint@8 espree@10 eslint-visitor-keys@4 --force
      - name: Restore dist cache
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist
      - name: Test
        run: npm test

  test-with-eslint-v9:
    name: Test with ESLint v9
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node.js v18
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 18
      - name: Install Packages
        run: npm install --legacy-peer-deps
      - name: Install ESLint v9
        run: npm install --save-dev eslint@9 espree@10 eslint-visitor-keys@4 --force
      - name: Restore dist cache
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist
      - name: Test
        run: npm test

  test-without-eslint-stylistic:
    name: Test without ESLint Stylistic
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      - name: Install Packages
        run: npm install --legacy-peer-deps
      - name: Uninstall @stylistic/eslint-plugin
        run: npm uninstall @stylistic/eslint-plugin
      - name: Restore dist cache
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist
      - name: Test
        run: npm test

  test-with-old-eslint-stylistic:
    name: Test with old ESLint Stylistic
    strategy:
      matrix:
        stylistic: [2, 3, 4]
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      - name: Install Packages
        run: npm install --legacy-peer-deps
      - name: Install @stylistic/eslint-plugin v${{ matrix.stylistic }}
        run: npm install -D @stylistic/eslint-plugin@${{ matrix.stylistic }} --force
      - name: Restore dist cache
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist
      - name: Test
        run: npm test

  test-with-typescript-eslint-v7:
    name: Test with typescript-eslint v7
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      - name: Install Packages
        run: npm install --legacy-peer-deps
      - name: Install @typescript-eslint/parser v7 with compatible ESLint v9
        run: npm install -D @typescript-eslint/parser@7 eslint@9 espree@10 eslint-visitor-keys@4 --force
      - name: Restore dist cache
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist
      - name: Test
        run: npm test
