name: Release

on:
  push:
    branches:
      - master

permissions: {}

jobs:
  release:
    # prevents this action from running on forks
    if: github.repository == 'vuejs/eslint-plugin-vue'
    permissions:
      contents: write # to create release (changesets/action)
      pull-requests: write # to create pull request (changesets/action)
      id-token: write # OpenID Connect token needed for Trusted Publisher
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install Dependencies
        run: npm install

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: npm run changeset:version
          publish-script: npm run changeset:publish
